<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel = "stylesheet" href = "Expense_Tracker.css">
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
        <p>Track your daily expences easily</p>
    </header>
    <section class = "summary">

        <div class = "card">
            <h3>Total pocket money per month</h3>
            <p id = "pocket-money">₹5000</p>
        </div>
        
        <div class = "card">
            <h3>Total Expenses</h3>
            <p id = "total-expenses">₹0</p>
        </div>

        <div class = "card">
            <h3>Balance</h3>
            <p id = "balance">₹5000</p>
        </div>

    </section>

    <main class = "container">

        <section class = "table-section">

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Expense</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody id = "expense-list"></tbody>
            </table>

        </section>

        <section class = "form-section">

            <h2>Add Expenses</h2>

            <form id = "expense-form">
                <label for = "expense">Expense Name</label>
                <input type = "text" id = "expense" placeholder="Enter Expense"><br><br>

                <label for = "amount">Amount</label>
                <input type = "number" id = "amount" placeholder="Enter Amount"><br><br>

                <label for = "category">Category</label>
                <select id = "category">
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Entertainment</option>
                </select><br><br>

                <label for = "date">Date</label>
                <input type = "date" id = "date"><br><br>

                <button type = "submit">Add Expense</button><br><br>
            </form>

        </section>

    </main>

    <script src = "Expense_Tracker.js"></script>
</body>
</html>
